name: Deploy site and resume PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Calibri-compatible font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito

      - name: Build site with resume PDF
        run: |
          rsync -a --exclude='.*' --exclude='_site' ./ _site/
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --log-level=3 \
            --print-to-pdf=_site/Joe-Riggs-Resume.pdf "file://$PWD/index.html"
          test -s _site/Joe-Riggs-Resume.pdf

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
